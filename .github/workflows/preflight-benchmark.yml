name: Preflight comparison
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  zod:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        order: [forward, reverse]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
      - name: Same-source Zod comparison
        env:
          ORCA_BENCHMARK_ORDER: ${{ matrix.order }}
        run: node config/scripts/benchmark-unit-zod.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zod-${{ matrix.order }}
          path: .build/unit-zod-benchmark/
          retention-days: 14
